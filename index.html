<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slide-a-Lama — ICQ Classic</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;color:#3d2414}
body{background:#e6c58b;background-image:radial-gradient(circle at 50% 8%,#fff4c9 0,#d9aa61 42%,#8b572c 100%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:repeating-linear-gradient(0deg,transparent 0 3px,#6b3b19 4px),repeating-linear-gradient(90deg,transparent 0 7px,#fff 8px);mix-blend-mode:multiply}
.wrap{width:min(920px,96vw);margin:18px auto 30px}
.window{border:3px solid #69401f;border-radius:9px;background:#e9c47d;box-shadow:0 7px 22px #3b210d99,inset 0 1px #fff7d1;overflow:hidden}
.titlebar{height:43px;padding:7px 11px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#fff2b7,#d49a4c);border-bottom:2px solid #70421e;box-shadow:inset 0 1px #fff}
.brand{display:flex;align-items:center;gap:9px;font:bold 22px Georgia,serif;text-shadow:1px 1px #fff2bd}
.brand .icq{font:bold 11px Tahoma;background:#77bd35;color:white;border:2px solid #487d1c;border-radius:8px;padding:2px 5px;text-shadow:none}
.title-right{font:11px Tahoma;color:#6e482a}
.toolbar{padding:8px 10px;background:linear-gradient(#f7dfa5,#d6a75e);border-bottom:2px solid #95602c;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button,input,select{font:12px Tahoma,Arial,sans-serif}
button{border:1px solid #805027;border-radius:5px;padding:6px 10px;color:#422713;cursor:pointer;background:linear-gradient(#fff5c9,#dca858);box-shadow:inset 0 1px #fff9df,0 1px 1px #6b401e55;font-weight:bold}
button:hover{background:linear-gradient(#fffbdc,#e9bd69)}button:active{box-shadow:inset 0 2px 3px #76502d55}
button:disabled{opacity:.5;cursor:default}.room{height:28px;width:105px;padding:4px 7px;border:1px solid #7d512a;border-radius:4px;background:#fff9df}
.status{margin-left:auto;font-size:11px;font-weight:bold;color:#644021;white-space:nowrap}
.main{padding:13px;background:linear-gradient(90deg,#d7aa62,#f3d997 50%,#d7aa62)}
.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:9px}
.player{height:69px;border:2px solid #805026;border-radius:7px;background:linear-gradient(#f8e5ac,#c98e43);box-shadow:inset 0 1px #fff8d7,0 2px 4px #542b1255;display:flex;align-items:center;padding:6px 9px;position:relative}
.player.active{border-color:#c36b19;box-shadow:0 0 0 2px #ffd56b66,inset 0 1px #fff8d7,0 2px 5px #542b1255}
.avatar{width:54px;height:54px;display:grid;place-items:center}.player-info{flex:1;text-align:center}.pname{font:bold 13px Tahoma}.score{font:bold 26px Georgia;color:#703714;text-shadow:1px 1px #ffe6a2}.turnmark{font:bold 10px Tahoma;color:#a84611}
.middle-hud{text-align:center}.timer{font:bold 25px Georgia;color:#6e3315}.timer.warn{color:#b32013}.mode{font:bold 11px Tahoma}
.lamas{display:flex;justify-content:center;gap:1px;height:27px;overflow:hidden}.lama-mini{font-size:22px;filter:drop-shadow(1px 2px 1px #4a2a1477)}
.arena{display:grid;grid-template-columns:68px minmax(320px,440px) 68px;justify-content:center;gap:8px;align-items:center}
.side-arrows{display:flex;flex-direction:column;gap:7px}.push{height:45px;font-size:22px;padding:0;background:linear-gradient(#fff2bd,#bd7a30);border:2px solid #6c3c19;box-shadow:inset 0 1px #fff9da,0 2px 3px #4b271288}
.push.left:before{content:"◀"}.push.right:before{content:"▶"}.push.top{display:none}
.board-frame{padding:10px;border-radius:8px;background:linear-gradient(135deg,#6e3e1c,#c28a40 35%,#623516 75%,#d19a4e);border:3px solid #4b2a14;box-shadow:inset 0 0 0 2px #e3bd71,inset 0 0 12px #2c160c,0 5px 9px #4b281477}
.board{position:relative;display:grid;grid-template-columns:repeat(5,1fr);aspect-ratio:1;background:#9b6230;border:4px solid #5a3017;overflow:hidden}
.cell{position:relative;display:grid;place-items:center;border:1px solid #6d3d1d;background:linear-gradient(145deg,#e8bd6d,#9a5e2c);overflow:hidden}
.cell:after{content:"";position:absolute;inset:2px;border:1px solid #f5d58d33;pointer-events:none}
.tile{width:78%;height:78%;border-radius:17%;display:grid;place-items:center;background:radial-gradient(circle at 33% 25%,#fffbd8 0 10%,#f3cf74 12%,#c6802e 70%,#82471e 100%);border:2px solid #6a3616;box-shadow:inset 2px 2px 3px #fff8bf99,2px 3px 3px #42200d88;transform:translateZ(0);font-size:clamp(22px,5vw,35px)}
.tile.pop{animation:pop .34s ease}.tile.fall{animation:fall .24s ease}.tile.flash{animation:flash .42s ease}
@keyframes pop{0%{transform:scale(.6);opacity:.2}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes fall{0%{transform:translateY(-90%)}100%{transform:translateY(0)}}@keyframes flash{0%,100%{filter:brightness(1)}45%{filter:brightness(2.2);transform:scale(1.14)}}
.fruit{width:74%;height:74%;display:block}
.arrow-top{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:5px 2px 0}.arrow-top button{height:31px;padding:0;font-size:17px}
.help{margin:9px auto 0;max-width:600px;text-align:center;font:11px Tahoma;color:#684421;background:#f4dca0aa;border:1px solid #9b6833;border-radius:4px;padding:5px}
.bottom{padding:8px 12px;background:linear-gradient(#dba85c,#b87932);border-top:2px solid #875126;display:flex;justify-content:space-between;font-size:10px;color:#5b361c}
.modal-bg{position:fixed;inset:0;background:#271507aa;display:none;align-items:center;justify-content:center;z-index:5}.modal{width:min(390px,90vw);border:4px ridge #b77c35;border-radius:9px;background:#edc77e;box-shadow:0 10px 35px #000b;padding:18px;text-align:center}.modal h2{margin:0 0 8px;font:24px Georgia}.modal p{font-size:12px}.modal button{margin-top:8px}
@media(max-width:700px){.wrap{margin:4px auto}.title-right{display:none}.arena{grid-template-columns:42px minmax(250px,1fr) 42px;gap:4px}.push{height:38px}.hud{grid-template-columns:1fr 1fr}.middle-hud{grid-column:1/-1;grid-row:2;display:flex;justify-content:center;gap:15px;align-items:center}.player{height:58px}.avatar{width:43px;height:43px}.lamas{height:21px}.lama-mini{font-size:17px}.status{width:100%;margin-left:0}.toolbar{justify-content:center}}
</style>
</head>
<body>
<div class="wrap"><div class="window">
<div class="titlebar"><div class="brand"><span class="icq">ICQ</span><span>Slide-a-Lama</span></div><div class="title-right">Xtraz Game · 2 players</div></div>
<div class="toolbar"><button id="newBtn">Новая игра</button><button id="hostBtn">Создать игру</button><input class="room" id="room" placeholder="Код комнаты" maxlength="8"><button id="joinBtn">Подключиться</button><label style="font-size:11px"><input id="timed" type="checkbox" checked> 10 сек.</label><span class="status" id="status">Локальная игра</span></div>
<div class="main">
<div class="hud">
<div class="player" id="pl1"><div class="avatar" id="av1"></div><div class="player-info"><div class="pname">ИГРОК 1 <span class="turnmark" id="tm1"></span></div><div class="score" id="s1">0</div><div class="lamas" id="l1"></div></div></div>
<div class="middle-hud"><div class="timer" id="timer">10</div><div class="mode">SLOT MODE</div></div>
<div class="player" id="pl2"><div class="player-info"><div class="pname">ИГРОК 2 <span class="turnmark" id="tm2"></span></div><div class="score" id="s2">0</div><div class="lamas" id="l2"></div></div><div class="avatar" id="av2"></div></div>
</div>
<div class="arena"><div class="side-arrows"><button class="push left" data-dir="left" title="Вставить слева"></button><button class="push right" data-dir="right" title="Вставить справа"></button></div>
<div><div class="board-frame"><div class="board" id="board"></div></div><div class="arrow-top" id="arrows"></div></div>
<div></div></div>
<div class="help">Вставляй фишку с трёх сторон. Собирай 3 и больше одинаковых символов. Каждые 60 очков разницы — одна лама переходит к лидеру.</div>
</div><div class="bottom"><span>SLIDE-A-LAMA • ICQ CLASSIC REMAKE</span><span>sound: ON</span></div>
</div></div>
<div class="modal-bg" id="overlay"><div class="modal"><h2 id="win"></h2><p>Все десять лам выбрали победителя!</p><button onclick="closeModal()">Играть ещё</button></div></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const N=5,FRUITS=['cherry','lemon','orange','grape','watermelon','apple'];
let state=null,mySide=0,peer=null,conn=null,timerId=null,remaining=10,audioCtx=null;
const $=id=>document.getElementById(id);
const empty=()=>Array.from({length:N},()=>Array(N).fill(null));
const rand=()=>FRUITS[Math.floor(Math.random()*FRUITS.length)];
function llamaSvg(){return '<svg viewBox="0 0 80 80" aria-hidden="true"><path fill="#ead8a5" stroke="#70401f" stroke-width="3" d="M22 60c-7-12-4-27 5-34l-3-14 10 7 7-9 4 13c14 1 20 13 15 26l-5 12H22z"/><path fill="#fff2c9" stroke="#70401f" stroke-width="2" d="M45 39c6-7 15-5 18 1l-2 15-15 3-7-9z"/><circle cx="57" cy="45" r="2.4" fill="#38200f"/><path fill="none" stroke="#70401f" stroke-width="2" d="M57 53q4 3 8 0M26 60v13M48 61v12"/></svg>'}
function fruitSvg(t){let paths={cherry:'<circle cx="34" cy="49" r="12"/><circle cx="55" cy="52" r="12"/><path d="M39 38Q39 17 55 13M55 40Q59 21 55 13"/><path fill="#5e9d39" d="M54 14q13-8 20 3-12 5-20-3"/>',lemon:'<path d="M19 48Q40 15 66 37Q51 68 24 61Q15 57 19 48Z"/>',orange:'<circle cx="42" cy="45" r="24"/><path d="M42 21q5-9 13-8-4 8-13 8" fill="#5e9d39"/>',grape:'<circle cx="35" cy="33" r="8"/><circle cx="51" cy="36" r="8"/><circle cx="28" cy="47" r="8"/><circle cx="43" cy="49" r="8"/><circle cx="57" cy="51" r="8"/><circle cx="35" cy="61" r="8"/><circle cx="49" cy="64" r="8"/><path d="M42 27Q45 15 58 15" fill="none" stroke="#4f8f35" stroke-width="5"/>',watermelon:'<path d="M17 29Q42 70 67 29Z"/> <path d="M25 33Q42 56 59 33Z" fill="#ffe18c"/> <path d="M31 38l2 4m10-1v5m10-7l-2 5" stroke="#422" stroke-width="2"/>',apple:'<path d="M42 28Q21 18 18 43Q18 65 41 68Q65 65 65 43Q62 19 42 28Z"/><path d="M42 28Q42 15 53 12" fill="none" stroke="#553" stroke-width="4"/>'};let fill={cherry:'#bd2931',lemon:'#f5df46',orange:'#e87524',grape:'#7343a6',watermelon:'#4d9d3c',apple:'#d33b32'}[t];return '<svg class="fruit" viewBox="0 0 84 84"><g fill="'+fill+'" stroke="#693317" stroke-width="3">'+paths[t]+'</g></svg>'}
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}
function beep(freq,dur=.08,type='square',vol=.035){try{initAudio();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}
function soundMove(){beep(220,.05);setTimeout(()=>beep(330,.07),35)}
function soundMatch(n){[440,550,660,880].slice(0,Math.min(4,Math.max(1,Math.floor(n/2)))).forEach((f,i)=>setTimeout(()=>beep(f,.09,'triangle',.05),i*55))}
function soundWin(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.16,'triangle',.055),i*100))}
function newGame(){state={b:empty(),score:[0,0],lamas:[5,5],turn:0,queue:[rand(),rand()],timed:$('timed').checked};for(let r=0;r<N;r++)for(let c=0;c<N;c++)state.b[r][c]=rand();remaining=10;render();startTimer()}
function render(){if(!state)return;$('s1').textContent=state.score[0];$('s2').textContent=state.score[1];$('pl1').classList.toggle('active',state.turn===0);$('pl2').classList.toggle('active',state.turn===1);$('tm1').textContent=state.turn===0?'● ВАШ ХОД':'';$('tm2').textContent=state.turn===1?'● ВАШ ХОД':'';$('l1').innerHTML='🦙'.repeat(state.lamas[0]);$('l2').innerHTML='🦙'.repeat(state.lamas[1]);$('av1').innerHTML=llamaSvg();$('av2').innerHTML=llamaSvg();$('timer').textContent=state.timed?remaining:'∞';$('timer').classList.toggle('warn',remaining<=3&&state.timed);let b=$('board');b.innerHTML='';state.b.flat().forEach((v,i)=>{let d=document.createElement('div');d.className='cell';if(v){let t=document.createElement('div');t.className='tile pop';t.innerHTML=fruitSvg(v);d.appendChild(t)}b.appendChild(d)});let ar=$('arrows');ar.innerHTML='';for(let c=0;c<N;c++){let x=document.createElement('button');x.textContent='▼';x.onclick=()=>move('top',c);ar.appendChild(x)}$('status').textContent=conn?('Комната '+($('room').value||'')+' • ход игрока '+(state.turn+1)):'Локальная игра • ход игрока '+(state.turn+1)}
function move(dir,i){if(conn&&state.turn!==mySide)return;initAudio();let tile=state.queue.shift();state.queue.push(rand());if(dir==='top'){for(let r=N-1;r>0;r--)state.b[r][i]=state.b[r-1][i];state.b[0][i]=tile}if(dir==='left'){for(let c=N-1;c>0;c--)state.b[i][c]=state.b[i][c-1];state.b[i][0]=tile}if(dir==='right'){for(let c=0;c<N-1;c++)state.b[i][c]=state.b[i][c+1];state.b[i][N-1]=tile}soundMove();let got=resolve();state.score[state.turn]+=got;updateLamas();state.turn=1-state.turn;render();startTimer();if(got) soundMatch(got);if(conn)conn.send({type:'state',state});checkWin()}
function resolve(){let hit=new Set();for(let r=0;r<N;r++){let c=0;while(c<N){let e=c+1;while(e<N&&state.b[r][e]===state.b[r][c])e++;if(state.b[r][c]&&e-c>=3)for(let k=c;k<e;k++)hit.add(r*N+k);c=e}}for(let c=0;c<N;c++){let r=0;while(r<N){let e=r+1;while(e<N&&state.b[e][c]===state.b[r][c])e++;if(state.b[r][c]&&e-r>=3)for(let k=r;k<e;k++)hit.add(k*N+c);r=e}}hit.forEach(x=>state.b[Math.floor(x/N)][x%N]=null);for(let c=0;c<N;c++){let v=state.b.map(r=>r[c]).filter(Boolean),p=Array(N-v.length).fill(null).concat(v);for(let r=0;r<N;r++)state.b[r][c]=p[r]}return hit.size*10+(hit.size>=4?20:0)+(hit.size>=5?40:0)}
function updateLamas(){let d=Math.abs(state.score[0]-state.score[1]),lead=state.score[0]>=state.score[1]?0:1,total=Math.min(10,5+Math.floor(d/60));state.lamas[lead]=total;state.lamas[1-lead]=10-total}
function checkWin(){if(Math.max(...state.lamas)>=10){clearInterval(timerId);$('win').textContent='Победил игрок '+(state.lamas[0]>=10?'1':'2')+'!';$('overlay').style.display='flex';soundWin()}}
function closeModal(){$('overlay').style.display='none';newGame();if(conn)conn.send({type:'state',state})}
function startTimer(){clearInterval(timerId);remaining=10;if(!state.timed){render();return}timerId=setInterval(()=>{remaining--;render();if(remaining<=0){clearInterval(timerId);if(!conn||state.turn===mySide)move(['top','left','right'][Math.floor(Math.random()*3)],Math.floor(Math.random()*5))}},1000)}
document.querySelectorAll('.push').forEach(b=>b.onclick=()=>move(b.dataset.dir,Math.floor(Math.random()*5)));
$('newBtn').onclick=()=>{initAudio();newGame();if(conn)conn.send({type:'state',state})};
$('hostBtn').onclick=()=>{initAudio();if(peer)peer.destroy();mySide=0;peer=new Peer(Math.random().toString(36).slice(2,8).toUpperCase());peer.on('open',id=>{$('room').value=id;$('status').textContent='Код '+id+' • отправьте другу'});peer.on('connection',c=>{conn=c;conn.on('data',d=>{if(d.type==='state'){state=d.state;render();checkWin()}});conn.on('close',()=>{conn=null;$('status').textContent='Соперник отключился'});newGame();conn.send({type:'state',state})})};
$('joinBtn').onclick=()=>{initAudio();if(peer)peer.destroy();mySide=1;peer=new Peer();peer.on('open',()=>{conn=peer.connect($('room').value.trim().toUpperCase());conn.on('open',()=>{$('status').textContent='Подключено • ждём игру'});conn.on('data',d=>{if(d.type==='state'){state=d.state;render();checkWin()}})})};
newGame();
</script></body></html>
